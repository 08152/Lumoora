<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Offline KI – Logischer Chat</title>
  <style>
    body { background:#121212; color:#eee; font-family:Arial; padding:20px; }
    #chat { width:480px; margin:auto; background:#1e1e1e; padding:15px; border-radius:10px; }
    #window { height:320px; overflow-y:auto; border:1px solid #333; padding:10px; margin-bottom:10px; }
    .msg { margin-bottom:8px; }
    .user { color:#9cdcfe; }
    .bot { color:#c586c0; }
    #input { width:75%; padding:6px; background:#222; border:1px solid #444; color:#eee; }
    button { padding:6px 10px; background:#3b82f6; border:none; color:white; cursor:pointer; }
    button:hover { background:#2563eb; }
  </style>
</head>
<body>

<div id="chat">
  <h2>Offline KI – Logischer Chat</h2>
  <div id="window"></div>

  <input id="input" type="text" placeholder="Schreib mir eine Nachricht...">
  <button onclick="send()">Senden</button>

  <div id="status"></div>
</div>

<script src="model.js"></script>
<script>
  function addMsg(text, sender) {
    const w = document.getElementById("window");
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = (sender === "user" ? "Du: " : "KI: ") + text;
    w.appendChild(div);
    w.scrollTop = w.scrollHeight;
  }

  function send() {
    const text = document.getElementById("input").value.trim();
    if (!text) return;

    addMsg(text, "user");

    const answer = KI_generate(text);
    addMsg(answer, "bot");

    document.getElementById("input").value = "";
  }

  document.getElementById("status").textContent =
    "KI läuft lokal – ohne API, ohne Key, kostenlos.";
</script>

</body>
</html>
